apiVersion: v1
kind: Service
metadata:
  name: ecommerce-api-service
  namespace: ecommerce-prod
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: ecommerce-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  namespace: ecommerce-prod
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway # Forces linkage to Azure Application Gateway
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    appgw.ingress.kubernetes.io/backend-protocol: "http"
spec:
  tls:
  - hosts:
    - ://yourstore.com
    secretName: store-tls-cert # Cert auto-rotated by cert-manager / Key Vault
  rules:
  - host: ://yourstore.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ecommerce-api-service
            port:
              number: 8080
